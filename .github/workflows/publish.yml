name: Publish

# Publishes to npm when a GitHub Release is published. The release tag (e.g.
# v1.2.3) must match the version in create-expo-starter/package.json. Requires
# an NPM_TOKEN secret (an npm automation token) in the repository settings.
#
# NOTE: every step that touches the package sets `working-directory` — the
# publishable package.json lives in create-expo-starter/, not at the repo root
# (the root package.json is the private dev app and must never be published).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run every check but skip the actual npm publish"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # enables npm provenance
    defaults:
      run:
        working-directory: create-expo-starter
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json: $PKG_VERSION  |  tag: $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Verify template is in sync with the dev app
        working-directory: .
        run: |
          node ./scripts/sync-template.mjs
          if ! git diff --quiet; then
            echo "::error::Template is out of sync — refusing to publish a stale template."
            git diff --stat
            exit 1
          fi

      - name: Verify LICENSE ships in the tarball
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          if ! node -e "process.exit(require('/tmp/pack.json')[0].files.some(f => /^LICENSE$/.test(f.path)) ? 0 : 1)"; then
            echo "::error::LICENSE is missing from the published tarball."
            exit 1
          fi

      - name: Lint, unit tests & smoke test
        run: |
          npm run lint
          npm run test:unit
          npm test

      - name: Publish to npm
        if: github.event_name == 'release'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "All release checks passed. Publish skipped (workflow_dispatch)."
          npm pack --dry-run
