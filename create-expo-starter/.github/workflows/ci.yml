name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Lint & scaffold smoke test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The CLI has zero runtime dependencies, so there is nothing to install.
      - name: Syntax check
        run: npm run lint

      - name: Scaffold smoke test
        run: npm test
